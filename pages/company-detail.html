<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المطور — النمر للعقارات</title>
  <script>
    window.APP_CONFIG = { API_URL: 'http://localhost:8000/api/v1' };
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    body { padding-top: 72px; }
    
    .company-hero {
      position: relative;
      height: 400px;
      background: var(--bg-dark);
      display: flex;
      align-items: flex-end;
      padding-bottom: 40px;
    }
    .company-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }
    .company-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,29,53,1) 0%, transparent 100%);
    }
    .company-hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      gap: 32px;
      color: white;
    }
    .company-logo-large {
      width: 140px;
      height: 140px;
      border-radius: var(--radius-lg);
      border: 4px solid white;
      background: white;
      object-fit: cover;
      box-shadow: var(--shadow-lg);
    }
    .company-hero h1 { font-size: 3rem; margin-bottom: 8px; color: white; }
    .company-hero-meta { color: rgba(255,255,255,0.8); display: flex; gap: 20px; align-items: center; }
    
    .company-content { padding: 60px 0; }
    .company-desc { font-size: 1.1rem; line-height: 1.8; color: var(--text-secondary); max-width: 800px; margin-bottom: 60px; white-space: pre-wrap; }
    
  </style>
</head>
<body>

<nav class="navbar navbar-solid" id="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">النمر<span class="logo-accent">للعقارات</span></a>
    <ul class="navbar-nav" id="navMenu">
      <li><a href="../index.html">الرئيسية</a></li>
      <li><a href="projects.html">المشاريع</a></li>
      <li><a href="companies.html" class="active">المطورين</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="dashboard/index.html" class="btn btn-outline btn-sm">لوحة التحكم</a>
    </div>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div id="companyContainer">
  <div style="height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2024 النمر للعقارات. جميع الحقوق محفوظة.</span>
    </div>
  </div>
</footer>

<script type="module" src="../pages-js/company-detail.js"></script>
</body>
</html>
