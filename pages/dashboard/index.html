<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — النمر للعقارات</title>
  <script>window.APP_CONFIG = { API_URL: 'http://localhost:8000/api/v1' };</script>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body>

<!-- The body content will be wrapped by dashboard-layout.js -->
<div class="stat-cards">
  <div class="stat-card">
    <div class="stat-icon stat-icon-gold">🏢</div>
    <div><div class="stat-value" id="statCompanies">0</div><div class="stat-label">إجمالي المطورين</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon-navy">🏗️</div>
    <div><div class="stat-value" id="statProjects">0</div><div class="stat-label">إجمالي المشاريع</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon-info">🚪</div>
    <div><div class="stat-value" id="statUnits">0</div><div class="stat-label">إجمالي الوحدات</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon-success">🔑</div>
    <div><div class="stat-value" id="statAvailable">0</div><div class="stat-label">الوحدات المتاحة</div></div>
  </div>
</div>

<div class="grid grid-2">
  <div class="dash-card">
    <div class="dash-card-header"><h3>المشاريع حسب الحالة</h3></div>
    <div class="dash-card-body">
      <div id="chartStatus" style="display:flex;flex-direction:column;gap:16px;"></div>
    </div>
  </div>
  <div class="dash-card">
    <div class="dash-card-header"><h3>المشاريع حسب النوع</h3></div>
    <div class="dash-card-body">
      <div id="chartType" style="display:flex;flex-direction:column;gap:16px;"></div>
    </div>
  </div>
</div>

<script type="module" src="../../pages-js/dashboard/index.js"></script>
</body>
</html>
