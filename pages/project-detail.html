  <style>
    /* Project Detail Specific Styles */
    .project-hero {
      position: relative;
      height: 70vh;
      min-height: 500px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 60px;
      overflow: hidden;
    }
    .project-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .project-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,29,53,0.9) 0%, rgba(11,29,53,0.4) 50%, rgba(11,29,53,0.1) 100%);
    }
    .project-hero-content {
      position: relative;
      z-index: 10;
      color: white;
      width: 100%;
    }
    .project-hero-badges { display: flex; gap: 8px; margin-bottom: 16px; }
    .project-hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); color: white; margin-bottom: 10px; }
    .project-hero-meta { display: flex; align-items: center; gap: 24px; font-size: 1.1rem; color: rgba(255,255,255,0.8); }
    
    .project-developer {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      padding: 8px 16px 8px 8px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .project-developer:hover { background: rgba(255,255,255,0.2); }
    .project-developer img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; margin-left: 8px; margin-right: 0; }

    /* Key Info Bar */
    .key-info-bar {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      margin-top: -40px;
      position: relative;
      z-index: 20;
      padding: 32px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 24px;
    }
    .key-info-item { text-align: center; }
    .key-info-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .key-info-val { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; color: var(--color-navy); }

    /* Content Layout */
    .project-content { padding: 60px 0; }
    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 48px; }

    .content-section { margin-bottom: 48px; }
    .content-section h2 { font-size: 2rem; margin-bottom: 24px; color: var(--color-navy); }
    
    .features-list { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; }
    .features-list li {
      background: var(--bg-section-alt);
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .features-list li::before { content: '✓'; color: var(--color-gold); font-weight: bold; margin-left: 5px; }

    .payment-plan {
      background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-navy-mid) 100%);
      color: white;
      padding: 32px;
      border-radius: var(--radius-lg);
      margin-bottom: 48px;
    }
    .payment-plan h3 { color: var(--color-gold); margin-bottom: 16px; }

    .map-container { height: 400px; border-radius: var(--radius-lg); overflow: hidden; background: #eee; }
    .map-container iframe { width: 100%; height: 100%; border: none; }

    /* Sidebar */
    .contact-card {
      background: var(--bg-card);
      padding: 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 100px;
    }
    .contact-card h3 { margin-bottom: 24px; text-align: center; }

    @media (max-width: 992px) {
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
