<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المطورون — النمر للعقارات</title>
  <script>
    window.APP_CONFIG = { API_URL: 'http://localhost:8000/api/v1' };
  </script>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    body { padding-top: 72px; }
    .header { background: var(--bg-dark); padding: 60px 0; text-align: center; }
    .header h1 { color: var(--color-cream); margin-bottom: 12px; }
    .header p { color: rgba(248,244,238,0.65); max-width: 600px; margin: 0 auto; }
    
    .company-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .company-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
    .company-card-cover { height: 180px; background: var(--bg-section-alt); overflow: hidden; }
    .company-card-cover img { width: 100%; height: 100%; object-fit: cover; }
    .company-card-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
    .company-logo {
      width: 80px; height: 80px;
      border-radius: var(--radius-md);
      border: 4px solid var(--color-cream);
      box-shadow: var(--shadow-md);
      object-fit: cover;
      margin: -50px auto 16px;
      background: white;
    }
    .company-name { font-family: var(--font-heading); font-size: 1.3rem; font-weight: 600; margin-bottom: 12px; color: var(--color-navy); }
    .company-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
    .company-meta { padding-top: 16px; border-top: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-solid" id="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">النمر<span class="logo-accent">للعقارات</span></a>
    <ul class="navbar-nav" id="navMenu">
      <li><a href="../index.html">الرئيسية</a></li>
      <li><a href="projects.html">المشاريع</a></li>
      <li><a href="companies.html" class="active">المطورين</a></li>
    </ul>
    <div class="navbar-actions">
      <a href="dashboard/index.html" class="btn btn-outline btn-sm">لوحة التحكم</a>
    </div>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="header">
  <div class="container">
    <h1>شركاؤنا من المطورين</h1>
    <p>نحن شركاء مع المطورين العقاريين الأكثر ثقة وتميزًا في مصر لنقدم لك عقارات وفرص استثمارية استثنائية.</p>
  </div>
</div>

<div class="section">
  <div class="container">
    <div class="grid grid-3" id="companiesGrid">
      <div class="skeleton" style="height:350px;border-radius:var(--radius-lg)"></div>
      <div class="skeleton" style="height:350px;border-radius:var(--radius-lg)"></div>
      <div class="skeleton" style="height:350px;border-radius:var(--radius-lg)"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2024 النمر للعقارات. جميع الحقوق محفوظة.</span>
    </div>
  </div>
</footer>

<script type="module" src="../pages-js/companies.js"></script>
</body>
</html>
